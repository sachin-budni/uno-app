name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck both workspaces
        run: npm run typecheck

      - name: Server tests (Vitest)
        run: npm run test:server

      # ubuntu-latest ships Google Chrome, which karma-chrome-launcher finds on
      # PATH; angular.json already pins the ChromeHeadless browser.
      - name: Client tests (Karma)
        run: npm run test:web

      - name: Production build
        run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the server
        run: npm run build:server

      # Start both processes, wait for the stack, play a full game, tear down -
      # all in one step, so nothing depends on a background process surviving
      # between steps. Their output goes to files rather than being inherited:
      # a background child holding the step's stdout open hangs the whole job.
      - name: Play a full game end to end
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-1234567890
        run: |
          set -euo pipefail

          npm run dev:json > json-server.log 2>&1 &
          JSON_PID=$!
          node apps/server/dist/server.js > api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID $JSON_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 45); do
            if curl -fs http://127.0.0.1:3000/api/health > /dev/null; then
              echo "stack is up"
              break
            fi
            if [ "$i" = "45" ]; then
              echo "::error::the stack did not come up in time"
              echo "--- json-server.log ---"; cat json-server.log || true
              echo "--- api.log ---";         cat api.log || true
              exit 1
            fi
            sleep 2
          done

          # Registers two players, plays a full game over real sockets and checks
          # that history, statistics and the leaderboard were persisted.
          if ! npm run smoke; then
            echo "--- api.log ---"; cat api.log || true
            exit 1
          fi
